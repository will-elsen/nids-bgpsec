! AS64603 — transit, re-signs. Originates nothing: the only route in the lab
! is the one under study (10.64.2.0/24 from AS64602).
hostname bgpd
password zebra
router bgp 64603
  bgp router-id 10.0.0.3
  srx display
  srx set-proxy-id 10.0.0.3
  srx set-server 10.0.0.15 17900
  srx connect
  no srx extcommunity
  srx evaluation bgpsec distributed
  srx set-bgpsec-value undefined
  srx policy bgpsec local-preference valid   add      20
  srx policy bgpsec local-preference invalid subtract 20
  no srx policy bgpsec ignore undefined
  srx bgpsec ski 0 1 65DC493F029B0FDE1BDDC4B67B7DAF468D6054BF
  srx bgpsec active 0
  neighbor 10.23.0.2 remote-as 64602
  neighbor 10.23.0.2 bgpsec both
  neighbor 10.23.0.2 timers connect 5
  neighbor 10.34.0.4 remote-as 64604
  neighbor 10.34.0.4 bgpsec both
  neighbor 10.34.0.4 timers connect 5
log stdout
