# AS64605 — GoBGP-SRx observer. Derived from upstream
# gobgpd-as64605_4routers.conf; only the neighbor address changes (p2p link
# to AS64604). Note: unlike the QuaggaSRx routers, GoBGP-SRx does not talk to
# srx-server — it signs and validates locally via srx-crypto-api against the
# shared key vault below (which holds the Krill-issued certs for all ASes).
# The SKI is this router's own key, used for signing toward the neighbor.
[global.config]
  as = "64605"
  router-id = "10.0.0.5"
  key-path = "/var/lib/bgpsec-keys"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.45.0.4"
    peer-as = "64604"
    bgpsec-enable = true
    SKI = "0BDC2CF0FCE3D32E845843EF38AA6BECCA991792"
