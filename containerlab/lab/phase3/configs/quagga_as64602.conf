! AS64602 — origin. Announces 10.64.2.0/24 (the curriculum prefix, plan §4).
! Derived from upstream quagga_as64602.conf; changes: p2p neighbor addressing
! (10.23.0.0/24 link to AS64603), curriculum prefix instead of 10.2.0.0/16,
! and fast connect retry so convergence doesn't wait on Quagga's 120s default.
hostname bgpd
password zebra
router bgp 64602
  bgp router-id 10.0.0.2
  srx display
  srx set-proxy-id 10.0.0.2
  srx set-server 10.0.0.15 17900
  srx connect
  no srx extcommunity
  srx evaluation bgpsec distributed
  srx set-bgpsec-value undefined
  srx policy bgpsec local-preference valid   add      20
  srx policy bgpsec local-preference invalid subtract 20
  no srx policy bgpsec ignore undefined
  srx bgpsec ski 0 1 8BF7BA16BAC2D49E1663657AABD3A0480F686A31
  srx bgpsec active 0
  network 10.64.2.0/24
  neighbor 10.23.0.3 remote-as 64603
  neighbor 10.23.0.3 bgpsec both
  neighbor 10.23.0.3 timers connect 5
log stdout
