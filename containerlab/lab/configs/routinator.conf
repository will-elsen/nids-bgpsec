# Lab-owned Routinator config. Based on bgpsec-testbed/topologies/configs/
# routinator.conf (unmodified upstream), plus `refresh`: the 600s default
# means a ROA issued in Krill takes up to 10 minutes to reach the routers,
# which makes the Part B ROA-lifecycle exercise (and any interactive
# verification) unusably slow. 30s keeps propagation observable in seconds
# while staying an honest poll-based sync, not a simulation.
repository-dir = "/home/routinator/.rpki-cache/repository"
enable-bgpsec = true
no-rir-tals = true
allow-dubious-hosts = true
extra-tals-dir = "/home/routinator/krill-tal/"
refresh = 30
