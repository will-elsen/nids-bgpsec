// Lab-owned SRx-server config. Upstream's copy in the vendored testbed is
// left untouched; this replaces it at bind time.
//
// One change from upstream: the `mapping` block names all five QuaggaSRx
// routers instead of the two that the testbed's two-router topology needed.
// srx_server keys its client table by proxy ID, and a router whose ID is not
// pre-configured gets a slot allocated dynamically on first contact. That is
// fine once, but the curriculum restarts every router at each part boundary,
// and a dynamic entry left behind by a previous run blocks its own router
// from re-registering — the handshake times out, every validation result
// comes back `undefined`, and the router drops the route. Pre-configuring
// makes the assignment deterministic.
//
// The attacker (10.0.0.6) is listed too. It has no more privilege than anyone
// else here — it runs the same software and asks the same validator the same
// questions. That is rather the point of Parts A to C: the attacks need no
// special position, only the ability to send an UPDATE.

verbose  = true;
loglevel = 7;
sync    = true;
port    = 17900;

console: {
  port = 17901;
  password = "x";
};

rpki: {
  host = "10.0.0.14";
  port = 3323;
  router_protocol = 1;
};

bgpsec: {
  srxcryptoapi_cfg = "/usr/local/etc/srxcryptoapi.conf";
  sync_logging = true;
};

mode: {
  no-sendqueue = true;
  no-receivequeue = false;
};

// One slot per QuaggaSRx router, keyed by its `srx set-proxy-id`.
// AS64605 is absent on purpose: GoBGP-SRx does not use srx_server at all,
// it validates locally through srx-crypto-api.
mapping: {
  client_1 = "10.0.0.7"    // AS64601, transit
  client_2 = "10.0.0.2"    // AS64602, origin
  client_3 = "10.0.0.3"    // AS64603, transit
  client_4 = "10.0.0.4"    // AS64604, transit and the attacker's peer
  client_6 = "10.0.0.6"    // AS64666, the attacker
};

grpc: {
  port = 50051;
};
