! AS64602 — generated by lab/tools/gen_configs.py for part c.
! Do not edit: regenerate instead, or the next set_part.sh overwrites it.
!
! Part C — BGPsec. Every session signs and verifies the path, so the
! forged adjacency to AS64602 can no longer be manufactured.
hostname bgpd
password zebra
router bgp 64602
  bgp router-id 10.0.0.2
  srx display
  srx set-proxy-id 10.0.0.2
  srx set-server 10.0.0.15 17900
  srx connect
  no srx extcommunity
  no srx policy origin ignore undefined
  srx evaluation origin
  srx set-origin-value undefined
  srx policy origin local-preference valid add 20
  srx policy origin ignore invalid
  srx evaluation bgpsec distributed
  srx set-bgpsec-value undefined
  srx policy bgpsec local-preference valid add 20
  srx policy bgpsec ignore invalid
  no srx policy bgpsec ignore undefined
  srx bgpsec ski 0 1 8BF7BA16BAC2D49E1663657AABD3A0480F686A31
  srx bgpsec active 0
  network 10.64.2.0/24
  neighbor 10.21.0.1 remote-as 64601
  neighbor 10.21.0.1 bgpsec both
  neighbor 10.21.0.1 timers connect 5
!
log stdout
