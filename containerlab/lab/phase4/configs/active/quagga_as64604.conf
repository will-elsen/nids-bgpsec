  srx policy origin ignore invalid
  no srx evaluation bgpsec
  neighbor 10.34.0.3 remote-as 64603
  neighbor 10.34.0.3 timers connect 5
  neighbor 10.45.0.5 remote-as 64605
  neighbor 10.45.0.5 timers connect 5
