! Part B — RPKI and ROV. Origin validation is on and invalid routes
! are dropped, which stops the plain hijack. The forged path still
! gets through, because the origin it names is the authorised one.
hostname bgpd
password zebra
router bgp 64601
  bgp router-id 10.0.0.7
  srx display
  srx set-proxy-id 10.0.0.7
  srx set-server 10.0.0.15 17900
  srx connect
  no srx extcommunity
  no srx policy origin ignore undefined
  srx evaluation origin
  srx set-origin-value undefined
  srx policy origin local-preference valid add 20
  srx policy origin ignore invalid
  no srx evaluation bgpsec
  neighbor 10.21.0.2 remote-as 64602
  neighbor 10.21.0.2 timers connect 5
  neighbor 10.13.0.3 remote-as 64603
  neighbor 10.13.0.3 timers connect 5
